<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#059669" />
      <stop offset="100%" stopColor="#064E3B" />
    </linearGradient>

    <!-- Face Gradient -->
    <linearGradient id="favFace" x1="28" y1="36" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6EE7B7" />
      <stop offset="50%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>

    <!-- Glasses Gold Metallic -->
    <linearGradient id="favGold" x1="30" y1="56" x2="98" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Cap Gradient -->
    <linearGradient id="favCap" x1="36" y1="20" x2="92" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#818CF8" />
      <stop offset="100%" stopColor="#4338CA" />
    </linearGradient>
  </defs>

  <!-- App Rounded Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#favBg)" />
  <rect x="5.5" y="5.5" width="117" height="117" rx="30.5" stroke="#34D399" stroke-width="3" stroke-opacity="0.5" />

  <!-- Math Buddy Ears with + and - -->
  <circle cx="24" cy="74" r="12" fill="#047857" stroke="#34D399" stroke-width="2.5" />
  <path d="M20 74H28M24 70V78" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <circle cx="104" cy="74" r="12" fill="#047857" stroke="#34D399" stroke-width="2.5" />
  <path d="M100 74H108" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Spring Antenna with Golden Star -->
  <path d="M64 36 C62 26, 72 22, 64 16 C60 12, 67 8, 64 5" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none" />
  <g transform="translate(64, 6)">
    <polygon points="0,-9 2.5,-3 9,0 2.5,3 0,9 -2.5,3 -9,0 -2.5,-3" fill="#FBBF24" stroke="#D97706" stroke-width="1.2" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Mascot Head -->
  <rect x="26" y="36" width="76" height="70" rx="28" fill="url(#favFace)" stroke="#064E3B" stroke-width="3" />

  <!-- Little Graduation Cap -->
  <g transform="rotate(-12 64 32) translate(4, -2)">
    <polygon points="64,18 92,28 64,36 36,28" fill="url(#favCap)" stroke="#312E81" stroke-width="1.5" />
    <circle cx="64" cy="27" r="3" fill="#FBBF24" />
    <path d="M64 27 Q80 30 84 40" stroke="#FBBF24" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="84" cy="40" r="2.5" fill="#D97706" />
  </g>

  <!-- Big Round Golden Glasses -->
  <circle cx="49" cy="68" r="16" fill="#FFFFFF" fill-opacity="0.35" stroke="url(#favGold)" stroke-width="4" />
  <circle cx="79" cy="68" r="16" fill="#FFFFFF" fill-opacity="0.35" stroke="url(#favGold)" stroke-width="4" />
  <path d="M62 67 Q64 63 66 67" stroke="url(#favGold)" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Big Sparkling Cartoon Eyes -->
  <circle cx="49" cy="68" r="9" fill="#0F172A" />
  <circle cx="46.5" cy="65.5" r="3.5" fill="#FFFFFF" />
  <circle cx="51.5" cy="71" r="1.8" fill="#38BDF8" />

  <circle cx="79" cy="68" r="9" fill="#0F172A" />
  <circle cx="76.5" cy="65.5" r="3.5" fill="#FFFFFF" />
  <circle cx="81.5" cy="71" r="1.8" fill="#38BDF8" />

  <!-- Rosy Cheeks -->
  <ellipse cx="37" cy="85" rx="6.5" ry="4" fill="#F43F5E" fill-opacity="0.5" />
  <ellipse cx="91" cy="85" rx="6.5" ry="4" fill="#F43F5E" fill-opacity="0.5" />

  <!-- Joyful Smile with Tongue -->
  <path d="M51 86 Q64 102 77 86 Z" fill="#881337" stroke="#4C0519" stroke-width="1.5" />
  <path d="M56 92 Q64 87 72 92 Q64 102 56 92 Z" fill="#FB7185" />
  <path d="M54 87 Q64 89 74 87" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

  <!-- Cute Red Bow Tie with Multiplier '×' -->
  <g transform="translate(64, 107)">
    <polygon points="0,0 -13,-7 -13,7" fill="#EF4444" stroke="#991B1B" stroke-width="1.2" />
    <polygon points="0,0 13,-7 13,7" fill="#EF4444" stroke="#991B1B" stroke-width="1.2" />
    <circle cx="0" cy="0" r="4.5" fill="#FDE047" stroke="#D97706" stroke-width="1.2" />
    <path d="M-2 -2 L2 2 M-2 2 L2 -2" stroke="#92400E" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
